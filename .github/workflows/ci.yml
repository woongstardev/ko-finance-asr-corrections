name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The benchmark is standard-library only, on purpose (see CONTRIBUTING.md).
      # No install step here is a feature: if this job ever needs `pip install`,
      # that constraint has been broken.
      - name: Benchmark scorer tests
        run: python3 benchmark/test_score.py

      # The real gates, not a CI-only copy of them: schema contract, prose-number
      # drift, and the benchmark regression check. The person-name check inside
      # validate_snapshot reads a list that lives outside this repo, so in CI it
      # warns rather than passing silently; the release path runs it with
      # --require-person-list, where a missing list is a failure.
      # Every rule in the gates, one synthetic violation each. The gates above
      # only prove the *current* snapshot passes; these prove a broken one would
      # not - which is the property that actually failed on 2026-08-27, when a
      # snapshot with every frequency zeroed sailed through all three.
      - name: Gate regression tests
        run: python3 scripts/test_gates.py

      - name: Snapshot contract and prose numbers
        run: python3 scripts/validate_snapshot.py

      - name: Benchmark gate
        run: python3 scripts/benchmark_gate.py

      # scripts/release_check.py is deliberately NOT run here: it scans git history
      # for person names using that same off-repo list, so in CI it would find
      # nothing and pass vacuously. A boundary check that can only fail open is
      # worse than no check. It runs on the release host instead.
      - name: Issue forms are valid YAML
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, yaml
          for f in sorted(pathlib.Path(".github/ISSUE_TEMPLATE").glob("*.yml")):
              doc = yaml.safe_load(f.read_text(encoding="utf-8"))
              if f.name != "config.yml":
                  assert {"name", "description", "body"} <= set(doc), f
              print("ok", f)
          doc = yaml.safe_load(pathlib.Path("CITATION.cff").read_text(encoding="utf-8"))
          assert doc["cff-version"] == "1.2.0" and doc["type"] == "dataset"
          print("ok CITATION.cff")
          PY
